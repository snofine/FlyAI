[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flybrain"
version = "0.1.0"
description = "Connectome-driven virtual Drosophila simulation using MaleCNS v1.0"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = ["pygame-ce>=2.5"]
dev = ["pytest>=8.0"]
neuprint = ["neuprint-python>=0.5"]

[project.scripts]
flybrain = "flybrain.app:main"
flybrain-download = "flybrain.tools.download_data:main"
flybrain-preprocess = "flybrain.tools.preprocess_connectome:main"
flybrain-inspect = "flybrain.tools.inspect_neuron:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flybrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

